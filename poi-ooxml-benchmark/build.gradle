// JMH benchmarks for the OOXML modules. Kept apart from poi-benchmark because
// building poi-ooxml (and poi-ooxml-full) is slow; the fixtures are shared via
// a dependency on poi-benchmark.
//
// Run with: ./gradlew :poi-ooxml-benchmark:jmh
// Restrict to some benchmarks with: ./gradlew :poi-ooxml-benchmark:jmh -Pjmh.includes=XSSFFormulaEvaluation

apply plugin: 'me.champeau.jmh'

dependencies {
    implementation project(':poi-ooxml')
    implementation project(':poi-benchmark')

    jmhRuntimeOnly "org.apache.logging.log4j:log4j-core:${log4jVersion}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testRuntimeOnly "org.apache.logging.log4j:log4j-core:${log4jVersion}"
}

jmh {
    jmhVersion = '1.37'

    // threads, forks, warmup and measurement are set by the annotations on each benchmark class
    // (values set here would override them); only the selection of benchmarks is taken from the
    // command line
    if (project.hasProperty('jmh.includes')) {
        includes = [project.property('jmh.includes')]
    }
    resultFormat = 'JSON'
    resultsFile = project.file("${project.buildDir}/reports/jmh/results.json")
    humanOutputFile = project.file("${project.buildDir}/reports/jmh/human.txt")
    duplicateClassesStrategy = DuplicatesStrategy.EXCLUDE
}

// the root build treats every Jar as a distribution artifact (dist dir, checksums, clean-up of
// jars with other names); the runnable benchmark jar is not one, so keep it in the module's build dir
jmhJar {
    destinationDirectory = layout.buildDirectory.dir('libs')
}

javadoc.enabled = false
sourcesJar.enabled = false

generateMetadataFileForPOIPublication.enabled = false
publishPOIPublicationToMavenLocal.enabled = false
