// Fuzz targets for OSS-Fuzz integration.
// Jazzer is provided at runtime by the OSS-Fuzz build environment; we only
// need the API jar at compile time.

plugins {
    id 'com.gradleup.shadow' version '9.6.1'
}

dependencies {
    implementation project(':poi')
    implementation project(':poi-scratchpad')
    implementation project(':poi-examples')
    implementation project(path:':poi-integration', configuration:'tests')

    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
    // fuzzing can trigger zstd-code in commons-compress
    implementation 'com.github.luben:zstd-jni:1.5.7-24'
    implementation 'org.apache.commons:commons-lang3:3.21.0'
    implementation 'org.opentest4j:opentest4j:1.3.0'
    implementation 'com.code-intelligence:jazzer-api:0.30.0'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testRuntimeOnly "org.apiguardian:apiguardian-api:${apiGuardianVersion}"
}

javadoc.enabled = false
sourcesJar.enabled = false

// Merging all dependency jars inevitably pulls in duplicate META-INF entries
// (LICENSE, NOTICE, ...) from several POI modules.
// The fat jar is not a Maven-published artifact, so keep it out of
// "../build/dist/maven/${archivesName}" - the root build.gradle's doLast
// cleanup for that directory only expects plain "<name>-<version>.jar" style
// artifacts and would delete this "-all.jar" right after it is built.
shadowJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    destinationDirectory = layout.buildDirectory.dir('libs')
}

generateMetadataFileForPOIPublication.enabled = false
publishPOIPublicationToMavenLocal.enabled = false

// Create a separate jar for test-code to depend on it in other projects
// See http://stackoverflow.com/questions/5144325/gradle-test-dependency
tasks.register('testJar', Jar) {
    dependsOn testClasses
    destinationDirectory = file("../build/dist/maven/${base.archivesName.get()}-tests")
    setArchiveClassifier 'tests'
    from sourceSets.test.output + sourceSets.main.output
}
